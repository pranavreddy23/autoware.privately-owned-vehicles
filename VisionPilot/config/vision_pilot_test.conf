# VisionPilot test configuration
#
# Keep this file for OpenLane / ZOD video replay. Point the two paths at the
# same scenario assets, then rebuild with matching cmake -DDATASET=...
#   cmake -DDATASET=open_lane -DBUILD_TESTING=ON ...
#   cmake -DDATASET=zod       -DBUILD_TESTING=ON ...

source.video_realtime      = true
source.video_loop          = false

source.input_video         = <INPUT_VIDEO_FILE_PATH>
source.input_vehicle_speed = <INPUT_VEHICLE_SPEED_FILE_PATH>
# Must match cmake -DDATASET= (open_lane or zod)
source.dataset             = open_lane